{% load static %}
<header class="site-header" id="siteHeader">
    <div class="nav-container">
        <!-- Brand / Logo -->
        <a href="{% url 'home' %}" class="brand-link" aria-label="Aman Kumar Thakur Portfolio Home">
            <div class="logo-wrapper">
                <img src="{% static 'images/logo.jpg' %}" alt="Aman Kumar Thakur Logo" class="brand-logo">
                <span class="online-indicator" title="Online & Available"></span>
            </div>
            <div class="brand-text">
                <span class="brand-name">Aman Kumar<span class="accent-dot">.</span></span>
                <span class="brand-role">Web Developer</span>
            </div>
        </a>

        <!-- Desktop Navigation -->
        <nav class="desktop-nav" aria-label="Main Navigation">
            <ul class="nav-list">
                <li class="nav-item">
                    <a href="{% url 'home' %}" class="nav-link {% if request.resolver_match.url_name == 'home' and not request.GET.section %}active{% endif %}">
                        <i class="fa-solid fa-house-chimney"></i>
                        <span>Home</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'about' %}" class="nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}">
                        <i class="fa-solid fa-user-tie"></i>
                        <span>About</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'home' %}#projects" class="nav-link">
                        <i class="fa-solid fa-layer-group"></i>
                        <span>Projects</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'contact' %}" class="nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>Contact</span>
                    </a>
                </li>
            </ul>
        </nav>

        <!-- CTA Action & Mobile Toggle -->
        <div class="nav-actions">
            <a href="{% url 'contact' %}" class="btn-nav-cta">
                <span>Let's Talk</span>
                <i class="fa-solid fa-arrow-right"></i>
            </a>

            <!-- Mobile Hamburger Button -->
            <button class="mobile-toggle" id="mobileMenuBtn" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="mobileNavMenu">
                <span class="hamburger-bar"></span>
                <span class="hamburger-bar"></span>
                <span class="hamburger-bar"></span>
            </button>
        </div>
    </div>

    <!-- Mobile Navigation Drawer -->
    <div class="mobile-menu" id="mobileNavMenu" aria-hidden="true">
        <ul class="mobile-nav-list">
            <li>
                <a href="{% url 'home' %}" class="mobile-nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                    <i class="fa-solid fa-house-chimney"></i>
                    <span>Home</span>
                </a>
            </li>
            <li>
                <a href="{% url 'about' %}" class="mobile-nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}">
                    <i class="fa-solid fa-user-tie"></i>
                    <span>About</span>
                </a>
            </li>
            <li>
                <a href="{% url 'home' %}#projects" class="mobile-nav-link">
                    <i class="fa-solid fa-layer-group"></i>
                    <span>Projects</span>
                </a>
            </li>
            <li>
                <a href="{% url 'contact' %}" class="mobile-nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Contact</span>
                </a>
            </li>
        </ul>
        <div class="mobile-cta-wrap">
            <a href="{% url 'contact' %}" class="btn-primary full-width">
                <span>Get In Touch</span>
                <i class="fa-solid fa-envelope"></i>
            </a>
        </div>
    </div>
</header>
